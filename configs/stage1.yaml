# Portable Stage-1 recipe. scripts/configure.py resolves ${CW_*} placeholders.
model:
  model_path: ${CW_CKPT}
  text_encoder_path: ${CW_GEMMA}
  video_vae_path: ${CW_VIDEO_VAE}
  audio_vae_path: ${CW_AUDIO_VAE}
  training_mode: lora
  load_checkpoint: null
lora:
  rank: 128
  alpha: 128
  dropout: 0.0
  target_modules:
    - attn1.to_q
    - attn1.to_k
    - attn1.to_v
    - attn1.to_out.0
    - attn2.to_q
    - attn2.to_k
    - attn2.to_v
    - attn2.to_out.0
training_strategy:
  name: flexible
  video:
    is_generated: true
    latents_dir: latents
    conditions:
      - type: reference
        latents_dir: reference_latents
        probability: 1.0
      - type: prefix
        temporal_boundary: 4
        probability: 1.0
optimization:
  learning_rate: 1.0e-4
  steps: 8000
  batch_size: 1
  gradient_accumulation_steps: 8
  max_grad_norm: 1.0
  optimizer_type: adamw
  scheduler_type: linear
  scheduler_params: {}
  enable_gradient_checkpointing: true
acceleration:
  mixed_precision_mode: bf16
  quantization: null
  load_text_encoder_in_8bit: false
  offload_optimizer_during_validation: true
data:
  preprocessed_data_root: ${CW_DATA}
  num_dataloader_workers: 4
# Internal validation cases are not distributed. Enable validation after adding
# your own held-out samples; this changes monitoring, not the training objective.
validation:
  video_dims: [896, 512, 113]
  frame_rate: 24.0
  seed: 42
  inference_steps: 30
  interval: null
  samples: []
  generate_video: false
  generate_audio: false
  skip_initial_validation: true
checkpoints:
  interval: 250
  keep_last_n: -1
  precision: bfloat16
flow_matching:
  timestep_sampling_mode: shifted_logit_normal
  timestep_sampling_params: {}
hub:
  push_to_hub: false
  hub_model_id: null
wandb:
  enabled: false
  project: seerworld
  tags: [seerworld, stage1, iaa, rank128]
seed: 42
output_dir: ${CW_OUTPUT_ROOT}/seerworld_stage1_iaafix
